.opt{display:block;width:100%;margin:10px 0;padding:13px 15px;border:2px solid var(--ac);border-radius:14px;background:#fff;font:inherit;font-size:1rem;color:var(--ink);text-align:left;cursor:pointer}
.opt:hover{background:var(--ac);color:#fff}
.res{text-align:center}.pic{font-size:7rem;line-height:1.1;animation:pop .6s}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}}
.res h2{font-size:1.7rem;color:var(--ac)}
.foot{margin-top:14px;font-style:italic}
.btn{margin:18px 6px 0;padding:12px 22px;border:0;border-radius:30px;background:var(--ac);color:#fff;font:inherit;font-size:1rem;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ac)}
